<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>6mang</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <section class="project-home" id="projectHome" aria-label="项目管理">
      <header class="project-home-header">
        <div>
          <h1>项目管理</h1>
          <p>管理你的 AI Canvas 工作流项目。</p>
        </div>
        <div class="project-home-actions">
          <button class="ghost-button" data-action="import-project">导入 JSON</button>
          <button class="send-button" data-action="new-project">新建项目</button>
          <input id="projectImportInput" type="file" accept=".json,application/json" hidden />
        </div>
      </header>
      <main class="project-home-main">
        <div class="project-home-toolbar">
          <span id="projectCount">0 个项目</span>
          <span>本地保存</span>
        </div>
        <div class="project-grid" id="projectGrid"></div>
      </main>
    </section>

    <div class="app-shell" id="appShell" hidden>
      <header class="app-header">
        <div class="header-left">
          <button class="icon-button" data-action="home" aria-label="返回">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6" /></svg>
          </button>
          <button class="project-button" data-action="project-menu">
            <span id="projectName">AI Canvas Demo</span>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10l5 5 5-5" /></svg>
          </button>
        </div>
        <div class="header-center">
          <span class="status-dot"></span>
          <span id="saveState">本地已保存</span>
        </div>
        <div class="header-right">
          <button class="icon-button" data-action="download" title="批量下载" aria-label="批量下载">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m0 0l-4-4m4 4l4-4M5 21h14" /></svg>
          </button>
          <button class="icon-button" data-action="theme" title="切换主题" aria-label="切换主题">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a7 7 0 1 0 9 9 5.5 5.5 0 0 1-9-9z" /></svg>
          </button>
          <button class="icon-button" data-action="provider-switch" title="切换 API 平台" aria-label="切换 API 平台">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h13l-3-3M20 16H7l3 3" /></svg>
          </button>
          <button class="icon-button" data-action="settings" title="API 设置" aria-label="API 设置">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z" /><path d="M19.4 15a1.8 1.8 0 0 0 .36 2l.05.05a2.1 2.1 0 0 1-3 3l-.05-.05a1.8 1.8 0 0 0-2-.36 1.8 1.8 0 0 0-1.1 1.65V21a2.1 2.1 0 0 1-4.2 0v-.07a1.8 1.8 0 0 0-1.18-1.65 1.8 1.8 0 0 0-2 .36l-.05.05a2.1 2.1 0 0 1-3-3l.05-.05a1.8 1.8 0 0 0 .36-2 1.8 1.8 0 0 0-1.65-1.1H2a2.1 2.1 0 0 1 0-4.2h.07a1.8 1.8 0 0 0 1.65-1.18 1.8 1.8 0 0 0-.36-2l-.05-.05a2.1 2.1 0 0 1 3-3l.05.05a1.8 1.8 0 0 0 2 .36H8.4A1.8 1.8 0 0 0 9.5 2.07V2a2.1 2.1 0 0 1 4.2 0v.07a1.8 1.8 0 0 0 1.1 1.65 1.8 1.8 0 0 0 2-.36l.05-.05a2.1 2.1 0 0 1 3 3l-.05.05a1.8 1.8 0 0 0-.36 2v.05a1.8 1.8 0 0 0 1.65 1.1H22a2.1 2.1 0 0 1 0 4.2h-.07A1.8 1.8 0 0 0 19.4 15z" /></svg>
          </button>
        </div>
      </header>

      <main class="canvas-area">
        <div class="viewport" id="viewport" aria-label="AI 工作流无限画布">
          <div class="grid-layer" id="grid"></div>
          <svg class="edge-layer" id="edgeLayer" aria-hidden="true"></svg>
          <div class="canvas-world" id="world"></div>
        </div>

        <aside class="floating-toolbar" aria-label="工具栏">
          <button class="tool-main" data-action="toggle-node-menu" title="添加节点" aria-label="添加节点">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
          </button>
          <button class="tool-button" data-action="workflow-panel" title="工作流模板" aria-label="工作流模板">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z" /></svg>
          </button>
          <button class="tool-button" data-action="history-panel" title="历史记录" aria-label="历史记录">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8" /><path d="M12 8v4l3 2" /></svg>
          </button>
          <span class="toolbar-separator"></span>
          <button class="tool-button" data-action="add-text" title="文本节点" aria-label="文本节点">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 6h14M5 12h10M5 18h7" /></svg>
          </button>
          <button class="tool-button" data-action="add-image" title="图片节点" aria-label="图片节点">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7.5A2.5 2.5 0 0 1 7.5 5h9A2.5 2.5 0 0 1 19 7.5v9a2.5 2.5 0 0 1-2.5 2.5h-9A2.5 2.5 0 0 1 5 16.5z" /><path d="M8 15l2.5-3 2 2.2 1.2-1.4L17 16H7z" /></svg>
          </button>
          <button class="tool-button" data-action="add-image-config" title="图片生成" aria-label="图片生成">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l2.2 4.7L19 10l-4.8 2.3L12 17l-2.2-4.7L5 10l4.8-2.3z" /><path d="M19 16l.9 1.9L22 19l-2.1 1.1L19 22l-.9-1.9L16 19l2.1-1.1z" /></svg>
          </button>
          <button class="tool-button" data-action="add-video-config" title="视频生成配置" aria-label="视频生成配置">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z" /><path d="M17 10l4-2.5v9L17 14" /></svg>
          </button>
          <span class="toolbar-separator"></span>
          <button class="tool-button" data-action="undo" title="撤销" aria-label="撤销">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14l-4-4 4-4" /><path d="M5 10h9a5 5 0 0 1 0 10h-2" /></svg>
          </button>
          <button class="tool-button" data-action="redo" title="重做" aria-label="重做">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 14l4-4-4-4" /><path d="M19 10h-9a5 5 0 0 0 0 10h2" /></svg>
          </button>
        </aside>

        <div class="node-menu" id="nodeMenu" hidden>
          <button data-action="add-text"><span class="node-menu-icon blue"></span>文本节点</button>
          <button data-action="add-llm"><span class="node-menu-icon violet"></span>LLM 文本生成</button>
          <button data-action="add-storyboard-assistant"><span class="node-menu-icon violet"></span>分镜助手</button>
          <button data-action="add-prompt-optimizer"><span class="node-menu-icon violet"></span>提示词优化</button>
          <button data-action="add-image-config"><span class="node-menu-icon green"></span>图片生成</button>
          <button data-action="add-storyboard-config"><span class="node-menu-icon violet"></span>故事板生成</button>
          <button data-action="add-template-image-config"><span class="node-menu-icon green"></span>营销物料</button>
          <button data-action="add-face-swap-config"><span class="node-menu-icon green"></span>换脸</button>
          <button data-action="add-seedream-edit"><span class="node-menu-icon purple"></span>精确图片编辑</button>
          <button data-action="add-layer-separation"><span class="node-menu-icon purple"></span>智能图层分离</button>
          <button data-action="add-video-config"><span class="node-menu-icon orange"></span>视频生成配置</button>
          <button data-action="add-image"><span class="node-menu-icon purple"></span>图片节点</button>
          <button data-action="add-image-compare"><span class="node-menu-icon blue"></span>图片对比</button>
          <button data-action="add-image-expand"><span class="node-menu-icon green"></span>图片扩展</button>
          <button data-action="add-model3d"><span class="node-menu-icon purple"></span>3D 模型预览</button>
          <button data-action="add-uploaded-image"><span class="node-menu-icon blue"></span>载入图像</button>
          <button data-action="add-uploaded-video"><span class="node-menu-icon orange"></span>载入视频</button>
          <button data-action="add-video"><span class="node-menu-icon red"></span>视频节点</button>
        </div>

        <div class="bottom-controls">
          <button data-action="fit-view" title="适应视图" aria-label="适应视图">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3" /></svg>
          </button>
          <button data-action="zoom-out" aria-label="缩小">−</button>
          <span id="zoomLabel">100%</span>
          <button data-action="zoom-in" aria-label="放大">+</button>
        </div>

        <div class="processing" id="processing" hidden>
          <span class="spinner"></span>
          <span id="processingText">正在分析工作流...</span>
        </div>
      </main>
    </div>

    <dialog class="modal settings-modal" id="settingsModal"></dialog>

    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three/build/three.module.js",
          "three/addons/": "./vendor/three/jsm/"
        }
      }
    </script>
    <script type="module" src="./model-preview.js"></script>
    <script src="./image-templates.js"></script>
    <script src="./kling-provider.js"></script>
    <script src="./seedream-tools.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
